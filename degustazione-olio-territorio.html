<nav>

  <button id="prev" aria-label="Indietro">‹</button>
  <span id="count"></span>
  <button id="next" aria-label="Avanti">›</button>
  <button id="clear" title="Cancella tutte le risposte scritte nelle schede">Cancella risposte</button>
</nav>

<script>
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function go(n){
  i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  slides[i].scrollTop=0;
  document.getElementById('count').textContent=(i+1)+' / '+slides.length;
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===slides.length-1;
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
}
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}
});
// risposte: restano salvate in questo browser
document.querySelectorAll('.pg .f').forEach(f=>{
  try{const v=localStorage.getItem(f.dataset.k);if(v)f.value=v}catch(e){}
  f.addEventListener('input',()=>{try{localStorage.setItem(f.dataset.k,f.value)}catch(e){}});
});
document.getElementById('clear').onclick=()=>{
  if(!confirm('Cancellare tutte le risposte scritte?'))return;
  document.querySelectorAll('.pg .f').forEach(f=>{f.value='';try{localStorage.removeItem(f.dataset.k)}catch(e){}});
};
const h=parseInt(location.hash.slice(1));go(h?h-1:0);
</script>
