<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attività di italiano · Passaporto Italia</title>
<meta name="description" content="Attività online di italiano L2 della Scuola Passaporto Italia: gialli, giochi e lezioni.">
<style>
  :root { --bg:#fbf7f0; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5ddd0; --soft:#f3ece0; --green:#11524f; --lime:#bcc805; --red:#e8343a; }
  @media (prefers-color-scheme: dark) {
    :root { --green:#2e8a84; --bg:#15181c; --card:#1f242a; --ink:#f1f3f5; --muted:#9aa3ad; --line:#333a43; --soft:#262c33; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .flag { height:8px; background:linear-gradient(90deg,#11524f 0 40%,var(--lime) 40% 80%,var(--red) 80%); }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  header { margin-bottom:18px; }
  .logo { display:block; width:100%; max-width:340px; height:auto; background:#fff; border-radius:14px; padding:6px; margin:0 0 14px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0; font-size:14px; }
  input[type=search] { width:100%; min-height:48px; border:1px solid var(--line); background:var(--card); color:var(--ink);
                       border-radius:12px; padding:8px 14px; font-size:17px; margin-bottom:10px; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -16px 6px; padding:0 16px 4px; }
  .chips button { flex:none; min-height:38px; border:1px solid var(--line); background:var(--card); color:var(--ink);
                  border-radius:999px; font-size:14px; padding:2px 12px; cursor:pointer; }
  .chips button[aria-pressed="true"] { background:var(--green); border-color:var(--green); color:#fff; }
  .count { color:var(--muted); font-size:13px; margin:6px 0 12px; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid var(--green); outline-offset:2px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  a.card { display:flex; flex-direction:column; gap:4px; padding:14px; border:1px solid var(--line); background:var(--card);
           color:inherit; text-decoration:none; border-radius:16px; min-height:120px; }
  a.card:hover { border-color:var(--ink); }
  .card .ic { font-size:32px; line-height:1; }
  .card b { font-size:17px; }
  .card small { color:var(--muted); font-size:14px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:6px; }
  .lv, .new { font-size:12px; font-weight:700; border:1px solid var(--line); color:var(--muted); border-radius:99px; padding:1px 8px; }
  .new { background:var(--red); border-color:var(--red); color:#fff; }
  .empty { color:var(--muted); padding:24px 0; text-align:center; }
  footer { color:var(--muted); font-size:13px; margin-top:32px; text-align:center; }
</style>
</head>
<body>
<div class="flag"></div>
<main>
  <header>
    <img class="logo" src="logo.png" alt="Passaporto Italia · Scuola di lingua e cultura italiana" width="900" height="331">
    <div>
      <h1>Attività di italiano</h1>
      <p class="sub">Gialli, giochi e lezioni di italiano L2 da fare online</p>
    </div>
  </header>

  <input type="search" id="q" placeholder="Cerca un'attività…" aria-label="Cerca un'attività">
  <div class="chips" id="tipi" role="group" aria-label="Tipo"></div>
  <div class="chips" id="livelli" role="group" aria-label="Livello"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="lista"></div>

  <footer>Passaporto Italia · Scuola di lingua e cultura italiana</footer>
</main>
<script src="attivita.js"></script>
<script>
(function () {
  var stato = { q: "", tipo: "", livello: "" };
  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };

  function chip(box, etichetta, chiave, valore) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = etichetta;
    b.setAttribute("aria-pressed", stato[chiave] === valore);
    b.onclick = function () { stato[chiave] = valore; disegna(); };
    box.appendChild(b);
  }

  function livelliDi(a) { return (a.livello || "").split(/[–-]/).map(function (x) { return x.trim(); }); }

  function disegna() {
    var tipi = $("tipi"), livelli = $("livelli");
    tipi.innerHTML = ""; livelli.innerHTML = "";
    chip(tipi, "Tutte", "tipo", "");
    Object.keys(TIPI).forEach(function (k) {
      if (ATTIVITA.some(function (a) { return a.tipo === k; })) chip(tipi, TIPI[k].icona + " " + TIPI[k].nome, "tipo", k);
    });
    var tutti = [];
    ATTIVITA.forEach(function (a) { livelliDi(a).forEach(function (l) { if (l && tutti.indexOf(l) < 0) tutti.push(l); }); });
    tutti.sort();
    chip(livelli, "Tutti i livelli", "livello", "");
    tutti.forEach(function (l) { chip(livelli, l, "livello", l); });

    var q = norm(stato.q);
    var scelte = ATTIVITA.filter(function (a) {
      if (stato.tipo && a.tipo !== stato.tipo) return false;
      if (stato.livello && livelliDi(a).indexOf(stato.livello) < 0) return false;
      if (q && norm([a.titolo, a.info, a.tema, a.livello, (TIPI[a.tipo] || {}).nome].join(" ")).indexOf(q) < 0) return false;
      return true;
    });

    $("count").textContent = scelte.length === 1 ? "1 attività" : scelte.length + " attività";
    var lista = $("lista"); lista.innerHTML = "";
    if (!scelte.length) { lista.innerHTML = '<p class="empty">Nessuna attività trovata.</p>'; return; }

    var gruppi = {};
    scelte.forEach(function (a) { (gruppi[a.tema || "Altro"] = gruppi[a.tema || "Altro"] || []).push(a); });
    Object.keys(gruppi).forEach(function (tema) {
      var h = document.createElement("h2"); h.textContent = tema; lista.appendChild(h);
      var g = document.createElement("div"); g.className = "grid";
      gruppi[tema].forEach(function (a) {
        var c = document.createElement("a"); c.className = "card"; c.href = a.file;
        var t = TIPI[a.tipo] || { nome: "" };
        c.innerHTML = '<span class="ic"></span><b></b><small></small><span class="tags"></span>';
        c.querySelector(".ic").textContent = a.icona || t.icona || "📄";
        c.querySelector("b").textContent = a.titolo;
        c.querySelector("small").textContent = a.info || "";
        var tags = c.querySelector(".tags");
        [t.nome, a.livello].forEach(function (x) { if (x) { var s = document.createElement("span"); s.className = "lv"; s.textContent = x; tags.appendChild(s); } });
        if (a.nuovo) { var n = document.createElement("span"); n.className = "new"; n.textContent = "NUOVO"; tags.appendChild(n); }
        g.appendChild(c);
      });
      lista.appendChild(g);
    });
  }

  $("q").addEventListener("input", function (e) { stato.q = e.target.value; disegna(); });
  disegna();
})();
</script>
</body>
</html>
